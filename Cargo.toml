[package]
name = "zanzibar"
version = "0.3.4"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
readme = "README.md"
description = "Typed Zanzibar authorization for Rust, backed by Anvil."
keywords = ["authorization", "zanzibar", "rebac", "anvil"]
categories = ["authentication"]
authors = ["Worka <engineering@worka.ai>"]
homepage = "https://github.com/worka-ai/zanzibar"
repository = "https://github.com/worka-ai/zanzibar"
documentation = "https://docs.rs/zanzibar"
exclude = [".github/"]

[dependencies]
anvil-storage = "=0.9.0"
async-trait = "0.1.89"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1.49.0", features = ["sync", "time"] }
tonic = { version = "0.14" }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
