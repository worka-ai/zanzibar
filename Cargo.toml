[package]
name = "zanzibar"
version = "0.8.7"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
readme = "README.md"
description = "Typed Zanzibar authorization for Rust, backed by Keldra."
keywords = ["authorization", "zanzibar", "rebac", "keldra"]
categories = ["authentication"]
authors = ["Worka <engineering@worka.ai>"]
homepage = "https://github.com/worka-ai/zanzibar"
repository = "https://github.com/worka-ai/zanzibar"
documentation = "https://docs.rs/zanzibar"
exclude = [".github/"]

[dependencies]
keldra = "=0.25.0"
async-trait = "0.1.89"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
sqlx = { version = "0.8", optional = true, default-features = false, features = ["postgres", "runtime-tokio-rustls", "json", "uuid"] }
thiserror = "1.0"
tokio = { version = "1.49.0", features = ["sync", "time"] }
tonic = { version = "0.14" }
uuid = { version = "1", optional = true, features = ["v4"] }

[features]
default = ["postgres"]
postgres = ["dep:sha2", "dep:sqlx", "dep:uuid"]

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
