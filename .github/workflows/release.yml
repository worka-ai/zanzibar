name: Release
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Verify release tag matches crate version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zanzibar") | .version')"
          test "v${version}" = "${GITHUB_REF_NAME}"
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"

      - name: Test release source
        run: cargo test --all-features

      - name: Verify package
        run: cargo publish --dry-run

      - name: Check crates.io
        id: crates
        shell: bash
        env:
          CRATE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --user-agent "zanzibar-release/${CRATE_VERSION}" \
            "https://crates.io/api/v1/crates/zanzibar/${CRATE_VERSION}")"
          case "${status}" in
            200) echo 'published=true' >>"${GITHUB_OUTPUT}" ;;
            404) echo 'published=false' >>"${GITHUB_OUTPUT}" ;;
            *)
              echo "crates.io returned HTTP ${status}" >&2
              exit 1
              ;;
          esac

      - name: Publish to crates.io
        if: steps.crates.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Confirm existing crates.io release
        if: steps.crates.outputs.published == 'true'
        run: echo "zanzibar ${{ steps.release.outputs.version }} is already published"
